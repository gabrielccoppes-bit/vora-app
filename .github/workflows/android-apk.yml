# Gera o APK de Android a cada push (ou manualmente em Actions → Run workflow).
# O arquivo fica em Actions → (execução) → Artifacts → vora-android-apk.
name: App Android (APK)
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Valores públicos (a chave publishable é feita para ficar no app; a segurança vem do RLS)
      EXPO_PUBLIC_SUPABASE_URL: https://atgtitircagbjuazrmth.supabase.co
      EXPO_PUBLIC_SUPABASE_KEY: sb_publishable_c74HLVaf7jZ91WN928lb3A_JXq_iugX
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: vora-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
